{% extends "base.html" %}

{% block content %}
  <h1>Delete Tag?</h1>
  <p>Are you sure you want to delete this tag?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes!" class="btn btn-danger">
    <a href="{% url 'list:tag-list' %}" class="btn btn-secondary">No!</a>
  </form>
{% endblock %}
