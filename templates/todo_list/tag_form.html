{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center mt-5">
  <div class="w-50">
    <h1 class="text-center mb-3">{{ object|yesno:"Update, Create" }} Tag</h1>
    <form action="" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="text-center mt-3">
        <input class="btn btn-dark" type="submit" value="Save">
      </div>
    </form>
  </div>
</div>
{% endblock %}
