{% extends "base.html" %}

{% block content %}
  <h1>Your Tags <a href="{% url 'list:tag-create' %}" class="btn btn-success">+</a></h1>
  <hr>
  {% if tag_list %}
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td>{{ tag.name }}</td>
            <td><a href="{% url 'list:tag-update' tag.pk %}" class="btn btn-secondary">Update</a></td>
            <td><a href="{% url 'list:tag-delete' tag.pk %}" class="btn btn-secondary">Delete</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No tags for now...</p>
  {% endif %}
{% endblock %}
